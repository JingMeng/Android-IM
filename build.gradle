// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        maven {
            url 'https://maven.aliyun.com/repository/jcenter'
            content {
                includeGroup 'com.bigkoo'
                includeGroupByRegex 'cn[.]jiguang.*'
                includeGroup 'com.flyco.tablayout'
                includeGroup 'com.kyleduo.switchbutton'
                includeGroup 'com.contrarywind'
                includeGroup 'com.google.android'
            }
        }
        maven {
            url 'https://maven.jiguang.cn/nexus/content/repositories/releases/'
            content { includeGroupByRegex 'cn[.]jiguang.*' }
        }
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}
