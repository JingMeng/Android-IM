apply plugin: 'com.android.application'
android {
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    namespace 'com.wapchief.jpushim'
    compileSdk 34

    aaptOptions {
        cruncherEnabled = false

    }
    defaultConfig {
        applicationId "com.wapchief.jpushim"
        minSdk 16
        targetSdk 34
        versionCode 4
        versionName "1.0.3"
        multiDexEnabled true

        ndk {
            //????????????cpu?????so????            abiFilters "armeabi-v7a"
            // ????????'x86', 'x86_64', 'mips', 'mips64'
        }

        manifestPlaceholders = [
                JPUSH_PKGNAME: applicationId,
                JPUSH_APPKEY : "b47a37f342eba5f9fbcd1961", //JPush??????????????ppkey.
                JPUSH_CHANNEL: "developer-default", //??????????????
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    
    }

}

dependencies {
    //??????libs??????libs???
    implementation fileTree(include: ['*.jar'], dir: 'lib')
    testImplementation 'junit:junit:4.12'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'com.google.code.gson:gson:2.2.4'
    implementation 'com.bigkoo:svprogresshud:1.0.6'
    implementation 'androidx.multidex:multidex:2.0.1'
    //???
    implementation 'cn.jiguang.sdk:jpush:3.1.6'
    implementation 'cn.jiguang.sdk:jcore:1.2.5'
    implementation 'cn.jiguang.sdk:jmessage:2.7.1'
    //??????
